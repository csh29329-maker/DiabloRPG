# ============================================================
#  스킬 시스템 (0.7.1)  [전부 미검증: 수치는 임시값이며 밸런스 조정 전이다]
# ============================================================
# 사용 방법: /rpgskill 로 스킬 트리를 열고 직업 선택 -> 포인트 투자 -> 스킬 장착.
#   스킬은 RPG 무기를 "핫바 1번 칸"에서 손에 들고 있을 때만 나간다. (require-slot-one)
#   우클릭 = 우클릭 스킬, 좌클릭 = 좌클릭 스킬(없으면 기본 공격),
#   무기를 든 채 숫자키 2~9 = 그 칸에 등록된 스킬을 우클릭 스킬로 선택 (웅크린 채면 좌클릭 스킬).
skill-system:
  enabled: true
  require-slot-one: true      # true: 무기가 1번 칸 + 손에 들고 있어야 스킬 사용
  require-rpg-weapon: true    # true: RPG 아이템(등급이 붙은 무기)만 스킬 사용 가능
  start-points: 1             # 처음부터 가진 스킬 포인트 (테스트하기 쉽게 넉넉히 주려면 올린다)
  points-per-level: 1         # 마인크래프트 경험치 레벨 1당 포인트 (지금까지 도달한 최대 레벨 기준)
  allow-reset: true           # /rpgskill reset 허용 (끄면 관리자만)
  hit-players: false          # 스킬이 다른 플레이어에게도 맞는지 (PvP)
  debug: false                # true: 스킬 피해마다 콘솔에 요청 피해/실제 체력 변화를 찍는다 (원인 추적용)
  cast-time: 0.8              # 함성(시전 속도 스킬)의 기본 시전 시간(초). 시전 속도 옵션 N% 이면 /(1+N/100)
  length-scale: 0.5           # 원작 야드 -> 칸 변환 비율 (radius-yd 등에 곱함)
  defense-scale: 0.2          # 스킬의 "방어력 증가" 수치에 곱하는 비율 (원작 방어력%는 피해 감소%보다 훨씬 커서)
  defense-cap: 60             # 스킬로 얻는 방어력 증가 합계 상한(%)

# 직업. tabs 는 스킬 트리 탭 이름 (스킬의 tab 번호 0부터 대응).
classes:
  barbarian:
    name: "바바리안"
    icon: IRON_AXE
    description: "근접 전투 전문. 강력한 일격과 함성으로 싸운다."
    tabs: ["전투 기술", "전투 함성", "전투 숙련"]

# 스킬 정의.  (0.7.1: D2 바바리안 트리 기준. 수치는 D2 정보 사이트 요약값이며 게임에서 검증하지 않았다 [미검증])
#   class   직업 id (비우면 트리에 안 나오는 공용 스킬: 장비 발동/오라/저주용)
#   kind    melee(단일) / aoe(주변 범위) / fear(공포) / whirlwind(회전) / leap(도약) / leap_attack(대상에게 도약)
#           / buff(강화) / passive(패시브) / curse(저주) / aura(오라) / display(효과 없이 표시만)
#   tier    1~6 -> 필요 캐릭터 레벨 1/6/12/18/24/30, 트리의 세로 줄(row)도 티어로 정해진다. col 은 0~7.
#   speed   attack(공격 속도 영향) / cast(시전 속도 영향) / none
#   lock    같은 lock 의 스킬은 앞선 동작(착지 / 회전)이 끝나야 다시 쓸 수 있다.  재사용 대기시간은 없다.
#   prereq  ["스킬id:레벨"] 선행 스킬
#   수치 표기: 숫자 하나 / {base, per-level, per-level2, max} / {points: {레벨: 값}} (사이는 직선 보간) / {values: [레벨 순서 목록]}
#   radius-yd, range-yd, flee-dist-yd 는 원작 야드 값이며 skill-system.length-scale(0.5)을 곱해 칸으로 바꾼다.
#   damage-pct  무기 공격력(플레이어 공격력 속성) 대비 % 피해. 이후 장비의 % 증가/치명타/저항이 그대로 적용됨
#   magic-pct   무기 공격력 대비 % 비전 피해 (방어/저항 무시)
#   synergy     [{skill: 다른 스킬 id, stat: 늘어날 수치 이름, per-level: 그 스킬 1레벨당 증가량, mode: pct(곱셈 %) 생략하면 더하기}]
#   bonuses     패시브/버프/오라가 주는 옵션 (위 options 와 같은 이름 + "최대 생명력%", "최대 마나%")
#   weapon      sword / axe / mace : 그 무기를 들고 있을 때만 bonuses 적용
#   sounds      ["네임스페이스:소리이름", ...] 시전 시작 때 무작위로 하나 재생 (sound-volume, sound-pitch 로 크기/높이). 없으면 기본 효과음
#   curse/curse2 {type: amplify | lower_resist | weaken | reflect | slow | defense_down, amount, duration}
skills:
  # ================= 바바리안: 전투 기술 (탭 0) =================
