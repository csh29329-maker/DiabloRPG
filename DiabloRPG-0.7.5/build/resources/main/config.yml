# DiabloRPG 0.3.0 설정
# 옵션 수치는 희귀도별로 구분한다 (매직 / 레어).
# 전용 옵션(치명타, 강타, 회피, 저항 감소, 오라, 스킬 발동)은
# unique / set / runeword 서브섹션만 가지며, 매직·레어에는 롤되지 않는다.
#
# 구현 상태 (0.3.0):
#   [적용] = 전투에 실제 연결됨 (테스트 가능)
#   [로직] = 계산 로직은 있으나 테스트 아이템이 없어 미검증
#   [미구현] = 로어에 표시만 되고 효과 없음 (후속 버전 예정)

rarities:
  normal:
    display: "노말"
    min-options: 0
    max-options: 0
  magic:
    display: "매직"
    min-options: 1
    max-options: 2
  rare:
    display: "레어"
    min-options: 3
    max-options: 5
  # 아래 등급은 0.3.0에서 아직 구현되지 않음 (명령어는 응답하지만 아이템 미생성).
  unique:
    display: "유니크"
    min-options: 0
    max-options: 0
  set:
    display: "세트"
    min-options: 0
    max-options: 0
  runeword:
    display: "룬워드"
    min-options: 0
    max-options: 0

# 저항 상한/하한 (0.3.4)
#   max: 이 값을 넘는 저항은 잘린다 (기본 75).
#   min: 음수 저항의 하한 (기본 -100). 음수 저항은 해당 피해를 더 받는다.
#   이 항목이 없는 옛 config를 써도 같은 기본값으로 동작한다.
resist:
  max: 75
  min: -100

# 회피 상한 (0.6.3)
dodge:
  max: 75.0

# 원소 종류 (원소 피해 전환 대상 선택에 사용)
elements:
  - "화염"
  - "냉기"
  - "번개"
  - "독"
  - "비전"

options:
  # ===== 공격 옵션 =====
  공격력 증가:            # [적용] 0.2.0 보존
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"
  공격 속도 증가:          # [적용 — 0.3.1] Attribute.ATTACK_SPEED modifier (무기 메인 핸드)
    magic: {min: 3, max: 7}
    rare: {min: 8, max: 15}
    suffix: "%"
  물리 피해 추가:          # [적용]
    magic: {min: 1, max: 3}
    rare: {min: 2, max: 5}
    suffix: ""
  화염 피해 추가:          # [적용]
    magic: {min: 1, max: 3}
    rare: {min: 2, max: 5}
    suffix: ""
  냉기 피해 추가:          # [적용]
    magic: {min: 1, max: 3}
    rare: {min: 2, max: 5}
    suffix: ""
  번개 피해 추가:          # [적용]
    magic: {min: 1, max: 3}
    rare: {min: 2, max: 5}
    suffix: ""
  독 피해 추가:            # [적용]
    magic: {min: 1, max: 3}
    rare: {min: 2, max: 5}
    suffix: ""
  비전 피해 추가:          # [적용]
    magic: {min: 1, max: 3}
    rare: {min: 2, max: 5}
    suffix: ""
  원소 피해 전환:          # [적용] 대상 원소는 생성 시 무작위 결정
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"
  생명력 흡수:             # [적용]
    magic: {min: 1, max: 2}
    rare: {min: 2, max: 4}
    suffix: "%"
  마나 흡수:               # [적용 — 0.6.4] 입힌 피해의 %만큼 마나 회복
    magic: {min: 1, max: 2}
    rare: {min: 2, max: 4}
    suffix: "%"
  대상 방어력 감소:        # [적용] 방어력(ARMOR) 수치 감소 방식
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"
  시전 속도:               # [적용 — 0.7.1] 함성(시전 속도 스킬)의 시전 시간 단축
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"
  대상 둔화:               # [적용 — 0.3.2] 공격 시 % 확률로 대상에게 Slowness 5초 부여
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"
  악마 추가 피해:          # [적용 — 0.3.2] 악마 몹(블레이즈/가스트/마그마큐브/워든 등)에게 % 추가 피해
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"
  언데드 추가 피해:        # [적용 — 0.3.2] 언데드(좀비/스켈레톤/팬텀/위더 등)에게 % 추가 피해
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"

  # ===== 능력치 옵션 (0.6.0 적용: 효과는 아래 stats 섹션) =====
  힘:
    magic: {min: 2, max: 5}
    rare: {min: 4, max: 8}
    suffix: ""
  민첩:
    magic: {min: 2, max: 5}
    rare: {min: 4, max: 8}
    suffix: ""
  활력:
    magic: {min: 2, max: 5}
    rare: {min: 4, max: 8}
    suffix: ""
  마력:
    magic: {min: 2, max: 5}
    rare: {min: 4, max: 8}
    suffix: ""

  # ===== 방어/저항 옵션 (적용 — 0.3.0 방어 묶음) =====
  방어력 증가:            # [적용] 모든 피해 % 감소 (갑옷에 부착 시 피해자에게 적용)
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"
  물리 저항:              # [적용] 물리 피해 추가 % 감소
    magic: {min: 2, max: 5}
    rare: {min: 5, max: 10}
    suffix: "%"
  # 마법 저항은 0.6.3에서 비전 저항으로 통합됨 (기존 아이템의 '마법 저항' 로어도 비전 저항으로 호환 처리)
  화염 저항:              # [적용] 화염 피해 % 감소
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"
  냉기 저항:              # [적용] 냉기 피해 % 감소
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"
  번개 저항:              # [적용] 번개 피해 % 감소
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"
  독 저항:                # [적용] 독 피해 % 감소
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"
  비전 저항:              # [적용] 비전 피해 % 감소
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"
  모든 원소 저항:          # [적용] 모든 원소 피해 % 감소
    magic: {min: 2, max: 5}
    rare: {min: 5, max: 10}
    suffix: "%"
  피해 감소:              # [적용] 고정 수치 감소
    magic: {min: 1, max: 2}
    rare: {min: 2, max: 4}
    suffix: ""

  # ===== 생존/자원 옵션 (0.3.1: 최대 생명력·이동 속도 적용, 마나/회복 미구현) =====
  최대 생명력:            # [적용 — 0.3.1] Attribute.MAX_HEALTH modifier (갑옷에 부착 시 자동 적용)
    magic: {min: 10, max: 20}
    rare: {min: 20, max: 40}
    suffix: ""
  생명력 회복:
    magic: {min: 1, max: 2}
    rare: {min: 2, max: 4}
    suffix: ""
  마나 증가:
    magic: {min: 10, max: 20}
    rare: {min: 20, max: 40}
    suffix: ""
  마나 회복:
    magic: {min: 1, max: 2}
    rare: {min: 2, max: 4}
    suffix: ""
  이동 속도:              # [적용 — 0.3.1] Attribute.MOVEMENT_SPEED modifier (갑옷에 부착 시 자동 적용)
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"

  # ===== 획득/처치 옵션 (0.6.1 처치 회복 / 0.6.2 아이템 발견·골드 획득 적용) =====
  경험치 획득:            # [적용 — 0.6.3] 레어 이상 (처치 시 드롭 경험치 % 증가)
    rare: {min: 3, max: 7}
    suffix: "%"
  아이템 발견 확률:        # [적용 — 0.6.2]
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 15}
    suffix: "%"
  골드 획득량:             # [적용 — 0.6.2]
    magic: {min: 5, max: 10}
    rare: {min: 10, max: 20}
    suffix: "%"
  적 처치 시 생명력 회복:    # [적용 — 0.6.1]
    magic: {min: 1, max: 2}
    rare: {min: 2, max: 4}
    suffix: ""
  적 처치 시 마나 회복:      # [적용 — 0.6.1]
    magic: {min: 1, max: 2}
    rare: {min: 2, max: 4}
    suffix: ""

  # ===== 전용 옵션 (unique / set / runeword) =====
  # 0.3.0에서는 치명타/강타의 계산 로직만 존재 (테스트 아이템 없음 → 미검증).
  # 오라/스킬 발동은 수치만 정의 (미구현). 회피 확률·저항 감소는 0.6.3에서 적용됨.
  치명타 확률:            # [로직] 근접 2배 / 원거리 1.5배, 물리에만 적용
    unique: {min: 1, max: 5}
    set: {min: 1, max: 6}
    runeword: {min: 1, max: 8}
    suffix: "%"
  강타 확률:              # [로직] 근접 25% / 원거리 15%, 현재 체력 비례, 물리에만 적용
    unique: {min: 1, max: 5}
    set: {min: 1, max: 6}
    runeword: {min: 1, max: 8}
    suffix: "%"
  회피 확률:              # [적용 — 0.6.3] 엔티티 공격 피격 시 확률 회피
    unique: {min: 1, max: 5}
    set: {min: 1, max: 6}
    runeword: {min: 1, max: 8}
    suffix: "%"
  저항 감소:              # [적용 — 0.6.3] 룬워드 전용 (모든 원소 저항 감소, 0% 이하 관통)
    runeword: {min: 5, max: 15}
    suffix: "%"
  피해:                   # [적용 — 0.6.4] 고뇌(Grief) 방식 순수 피해 가산
    unique: {min: 4, max: 8}
    set: {min: 4, max: 8}
    runeword: {min: 8, max: 15}
    suffix: ""
  상처 열기:              # [적용 — 0.6.4] 타격 시 % 확률로 출혈 지속 피해 + 회복 차단
    unique: {min: 10, max: 25}
    set: {min: 10, max: 25}
    runeword: {min: 15, max: 35}
    suffix: "%"
  스킬 발동 확률:         # [미구현]
    unique: {min: 1, max: 5}
    set: {min: 1, max: 6}
    runeword: {min: 1, max: 8}
    suffix: "%"

# ===== 전투 세부 규칙 (0.6.4) =====
combat:
  # pre-percent  = 디아블로 2 고뇌 원작 방식 (% 공격력 증가·힘·치명타 적용 전에 무기 기본 피해에 가산)
  # post-percent = % 공격력 증가의 영향을 받지 않고 순수 물리 고정 피해로 가산
  flat-damage-mode: pre-percent
  ignore-defense-boss-scale: 0.5     # 방어 무시 사용 시 보스·PvP 대상 방어% 무시 비율 (일반 몹/샌드백은 1.0 = 100%)
  prevent-heal-seconds: 30           # 괴물 회복 저지 / 대상 회복 불가 지속 시간 (초)
  open-wounds:
    duration-sec: 8                  # 상처 열기 출혈 지속 시간 (초)
    damage-per-sec: 2.0              # 상처 열기 초당 출혈 피해 (방어/저항 무시)

# ===== 유니크 아이템 (0.3.6) =====
# 지급: /rpgitem give <플레이어> unique <ID>
#   base          기반 마인크래프트 아이템 (예: DIAMOND_SWORD)
#   options       옵션 종류는 고정, 수치는 min~max 사이에서 생성 시 한 번 굴림. 이름은 위 options의 이름과 같아야 효과가 연결됨.
#                 효과가 아직 없는 옵션(힘, 명중률 등)은 로어에만 표시된다.
#   damage-ranges 피해 종류(물리/화염/냉기/번개/독/비전)별로 최소 피해와 최대 피해가 각각 범위로 굴러간다.
#                 min-low~min-high = 최소 피해 범위, max-low~max-high = 최대 피해 범위.
#                 생성 때 최소/최대가 정해지고, 타격할 때마다 그 사이에서 다시 굴려 적용한다.
uniques:
  griswolds_edge:
    name: "그리스월드의 날"
    base: DIAMOND_SWORD
    options:
      공격 속도 증가: {min: 10, max: 10, suffix: "%"}
      공격력 증가: {min: 100, max: 160, suffix: "%"}
      대상 둔화: {min: 25, max: 25, suffix: "%"}   # 주의: 현재는 "25% 확률로 둔화 부여" 방식 (원작은 항상 25% 감속)
      명중률: {min: 100, max: 100}                  # 효과 없음 (공격은 항상 명중)
      힘: {min: 12, max: 12}                        # 0.6.0부터 적용 (근접 물리 피해 +N%)
      타격 시 피해 증폭 1레벨 시전: {min: 4, max: 4, suffix: "% 확률"}   # 0.7.0: 저주 시스템으로 활성화
    damage-ranges:
      화염: {min-low: 10, min-high: 12, max-low: 15, max-high: 25}
  goldskin:
    name: "골드스킨 (Goldskin)"
    base: IRON_CHESTPLATE
    options:
      방어력 증가: {min: 45, max: 65, suffix: "%"}
      모든 원소 저항: {min: 15, max: 25, suffix: "%"}
      골드 획득량: {min: 50, max: 100, suffix: "%"}
  tarnhelm:
    name: "탄헬름 (Tarnhelm)"
    base: IRON_HELMET
    options:
      아이템 발견 확률: {min: 25, max: 50, suffix: "%"}
      골드 획득량: {min: 50, max: 75, suffix: "%"}
      마력: {min: 10, max: 10}
  raven_claw:
    name: "레이븐 클로 (Raven Claw)"
    base: BOW
    options:
      공격력 증가: {min: 40, max: 60, suffix: "%"}
      화염 피해 추가: {min: 6, max: 12}
      민첩: {min: 10, max: 10}
  wall_of_the_eyeless:
    name: "아이리스의 벽 (Wall of the Eyeless)"
    base: SHIELD
    options:
      방어력 증가: {min: 20, max: 35, suffix: "%"}
      적 처치 시 마나 회복: {min: 5, max: 5}
      독 저항: {min: 20, max: 20, suffix: "%"}
  twitchthroe:
    name: "트위치스로우 (Twitchthroe)"
    base: IRON_CHESTPLATE
    options:
      회피 확률: {min: 15, max: 25, suffix: "%"}
      공격 속도 증가: {min: 15, max: 20, suffix: "%"}
      민첩: {min: 10, max: 10}

  skilltest_chest:
    name: "[테스트] 스킬 갑옷"
    base: IRON_CHESTPLATE
    options:
      모든 스킬: {min: 2, max: 2}
      바바리안 스킬: {min: 1, max: 1}
      강격 레벨: {min: 3, max: 3}
      힘의 오라: {min: 5, max: 5, suffix: "레벨"}
      피격 시 강철 처녀 1레벨 시전: {min: 30, max: 30, suffix: "% 확률"}
      방어력 증가: {min: 30, max: 30, suffix: "%"}
  skilltest_sword:
    name: "[테스트] 저주의 검"
    base: DIAMOND_SWORD
    options:
      타격 시 피해 증폭 1레벨 시전: {min: 100, max: 100, suffix: "% 확률"}
      타격 시 저항 낮추기 1레벨 시전: {min: 100, max: 100, suffix: "% 확률"}
      신성한 불 오라: {min: 3, max: 3, suffix: "레벨"}
# ===== 능력치 / 마나 / 생명력 회복 (0.6.0, 전부 미검증) =====
# 능력치는 장비 옵션으로만 올라간다 (방어구 4칸 + 보조 손 방패 + 주 손 무기 + 활성 세트 보너스 합산).
stats:
  strength:
    melee-phys-pct-per-point: 1.0    # 힘 1당 근접 물리 피해 +N% (활/석궁에는 적용 안 됨)
  dexterity:
    ranged-phys-pct-per-point: 1.0   # 민첩 1당 활/석궁 물리 피해 +N%
    defense-pct-per-point: 0.5       # 민첩 1당 방어력 증가 +N%
  vitality:
    health-per-point: 2.0            # 활력 1당 최대 생명력 +N (2 = 하트 1칸)
  energy:
    mana-per-point: 2.0              # 마력 1당 최대 마나 +N
mana:
  base: 20.0                         # 기본 최대 마나
  base-regen-per-sec: 0.5            # 기본 초당 마나 회복 (마나 회복 옵션이 더해짐)
  actionbar: true                    # 액션바에 생명력/마나 표시 (끄려면 false)
life-regen:
  per-point-per-sec: 0.2             # 생명력 회복 옵션 1당 초당 회복량

kill-recovery:
  hostile-only: true                 # true면 적대적 몹/플레이어 처치 시에만 회복 (가축 도축 파밍 방지)
  life-per-point: 1.0                # 적 처치 시 생명력 회복 옵션 1당 회복량
  mana-per-point: 1.0                # 적 처치 시 마나 회복 옵션 1당 회복량

# ===== 골드 / 장비 드롭 / 상점 / 도박 (0.6.2) =====
gold:
  actionbar: true                    # 액션바에 보유 골드 표시
  drop:
    enabled: true                    # 몬스터 처치 시 골드 자동 적립
    mob-min: 10                      # 일반 적대적 몹 최소 골드
    mob-max: 30                      # 일반 적대적 몹 최대 골드
    boss-min: 250                    # 보스(위더/엔더드래곤/워든/엘더가디언) 최소
    boss-max: 500                    # 보스 최대
    notify-chat: false               # true면 일반 몹 처치 때도 채팅으로 +골드 알림 (보스는 항상 알림)

drops:
  enabled: true                      # 몬스터 처치 시 RPG 장비 드롭
  mob-chance: 4.0                    # 일반 적대적 몹 기본 드롭 확률 (%)
  boss-chance: 100.0                 # 보스 기본 드롭 확률 (%)
  magic-find-drop-scale: 0.5         # 아이템 발견 확률 100%당 드롭 확률 +50% 가중 (0이면 등급만 상승)
  weights:
    normal: 55.0
    magic: 34.0
    rare: 9.0
    set: 1.2
    unique: 0.8

shop:
  block: GOLD_BLOCK                  # 우클릭 시 상점/도박 GUI 열림 (웅크리면 제외)

gamble:
  magic-find-affects: false          # true로 바꾸면 도박에도 아이템 발견 확률이 적용됨 (기본 false = 원작 기준)
  weights:
    magic: 88.0
    rare: 10.0
    set: 1.2
    unique: 0.8
  prices:
    sword: 120
    axe: 120
    bow: 110
    crossbow: 130
    helmet: 100
    armor: 150
    boots: 95
    shield: 110
# 마나는 아직 소비처(스킬)가 없다. 최대치, 회복, 표시, 저장만 동작한다.

# ===== 세트 아이템 (0.5.0, 전부 미검증) =====
# /rpgitem give <플레이어> set <세트ID>          세트 전체 부위 지급
# /rpgitem give <플레이어> set <세트ID>:<부위ID>  한 부위만 지급
# /rpgset            내가 착용한 세트와 활성 보너스 확인
# /rpgset list       등록된 세트 목록
#   pieces   부위. base=바닐라 아이템, options=부위 자체 옵션 (유니크처럼 종류 고정, 수치는 생성 때 min~max에서 굴림)
#   bonuses  키(숫자) = 필요한 서로 다른 부위 수. 그 수 이하의 단계가 모두 누적 적용된다.
#            보너스 수치는 고정값(value). 같은 옵션이 여러 단계에 있으면 더해진다.
#            "원소 피해 전환"은 세트 보너스로 쓸 수 없다.
#   inactive 시스템이 없어 효과가 없는 항목 (로어에 회색으로만 표시)
# 부위 수에 세는 칸: 방어구 4칸, 보조 손 방패, 주 손 무기(방어구/방패 제외). 같은 부위를 둘 입어도 1개로 센다.
# 아래 두 세트는 이름만 디아블로 2에서 따왔고, 부위 구성과 수치는 현재 있는 바닐라 장비 종류에 맞춘 임시값이다 (원작 아님).
# 장갑/허리띠 등 지원하지 않는 부위는 빠져 있다.
sets:
  sigons:
    name: "시곤의 완전한 강철 (Sigon's Complete Steel)"
    pieces:
      helm:
        name: "시곤의 면갑 (Sigon's Visor)"
        base: IRON_HELMET
        options:
          방어력 증가: {min: 10, max: 15, suffix: "%"}
          최대 생명력: {min: 10, max: 20}
      armor:
        name: "시곤의 보호구 (Sigon's Shelter)"
        base: IRON_CHESTPLATE
        options:
          방어력 증가: {min: 15, max: 25, suffix: "%"}
          물리 저항: {min: 5, max: 10, suffix: "%"}
      shield:
        name: "시곤의 방패 (Sigon's Guard)"
        base: SHIELD
        options:
          방어력 증가: {min: 10, max: 20, suffix: "%"}
          모든 원소 저항: {min: 5, max: 10, suffix: "%"}
      boots:
        name: "시곤의 장화 (Sigon's Sabot)"
        base: IRON_BOOTS
        options:
          이동 속도: {min: 5, max: 10, suffix: "%"}
          최대 생명력: {min: 10, max: 20}
    bonuses:
      2:
        options:
          최대 생명력: {value: 20}
      3:
        options:
          모든 원소 저항: {value: 10, suffix: "%"}
      4:
        options:
          방어력 증가: {value: 20, suffix: "%"}
          피해 감소: {value: 3}
  cleglaws:
    name: "클레글러의 도구 (Cleglaw's Brace)"
    pieces:
      sword:
        name: "클레글러의 이빨 (Cleglaw's Tooth)"
        base: DIAMOND_SWORD
        options:
          공격력 증가: {min: 30, max: 50, suffix: "%"}
          생명력 흡수: {min: 2, max: 3, suffix: "%"}
      shield:
        name: "클레글러의 발톱 (Cleglaw's Claw)"
        base: SHIELD
        options:
          방어력 증가: {min: 10, max: 20, suffix: "%"}
          물리 저항: {min: 5, max: 10, suffix: "%"}
    bonuses:
      2:
        options:
          공격 속도 증가: {value: 10, suffix: "%"}
          공격력 증가: {value: 15, suffix: "%"}

# ===== 룬 / 큐브 / 룬워드 (0.4.0, 전부 미검증) =====
# 룬 33종은 코드에 고정되어 있다 (El ~ Zod, 순서 = 룬 번호).
runes:
  # 룬 아이템의 기반 마인크래프트 아이템. 바꾸면 리소스팩의 모델 파일 이름도 같이 바꿔야 한다.
  item: AMETHYST_SHARD
  # 난이도 시스템이 아직 없어 여기서 직접 정한다: normal / nightmare / hell
  difficulty: normal
  # 난이도별로 드롭 가능한 가장 높은 룬 (핸드오프 문서 기준: 노말 Ral #8, 악몽 Ko #18, 지옥 Lo #28)
  max-rune:
    normal: Ral
    nightmare: Ko
    hell: Lo
  drop:
    chance: 2.0          # 일반 몬스터 처치 시 룬 1개가 나올 확률 (%) -- 임시값
    boss-chance: 25.0    # 보스(위더, 엔더 드래곤, 워든, 엘더 가디언) -- 임시값
    decay: 0.8           # 높은 번호 룬일수록 잘 안 나온다. 룬 n번의 가중치 = decay^(n-1) -- 임시값
    magic-find-scale: 0.0 # 아이템 발견 확률이 룬 드롭에도 영향을 줄지 비율 (0.0 = 원작처럼 미적용)

# 큐브: 아래 블록을 맨손/아무 아이템으로 우클릭하면 큐브 창이 열린다 (웅크리면 열리지 않음).
# 관리자는 /rpgcube 로도 열 수 있다.
cube:
  block: LODESTONE

# 룬워드 장비 종류 묶음. 룬워드의 types 에는 종류 이름이나 묶음 이름을 쓴다.
# 종류: sword axe mace spear(삼지창) bow crossbow helmet armor(가슴 갑옷) boots shield
# 장갑/목걸이/반지/허리띠/단검/지팡이/마법봉은 대응하는 바닐라 아이템이 없어 아직 지원하지 않는다.
item-groups:
  melee: [sword, axe, mace, spear]
  missile: [bow, crossbow]
  weapon: [sword, axe, mace, spear, bow, crossbow]

# 룬워드 레시피 (룬 조합은 디아블로 2 자료 두 곳에서 일치하는 것만 넣었다. 순서는 상관없음)
#   runes     필요한 룬 (순서 무관, 장비는 노말 등급이어야 함)
#   variants  장비 종류별 효과. types 가 맞는 첫 번째 variant 가 적용된다.
#   options   실제 효과가 연결되는 옵션 (위 options 와 같은 이름). 수치는 만들 때 min~max 에서 굴린다.
#   inactive  원작에는 있지만 이 플러그인에 시스템이 없어 효과가 없는 항목 (로어에 회색으로만 표시)
# 모든 수치는 원작이 아니라 이 서버용 임시값이다. 원작은 "+300% 공격력" 같은 값이라 그대로 쓰지 않았다.
